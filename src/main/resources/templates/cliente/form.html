<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">
    <h2 th:text="${editMode} ? 'Editar Cliente' : 'Novo Cliente'">Cliente</h2>

    <form th:action="${editMode} ? @{/clientes/{id}/editar(id=${cliente.id})} : @{/clientes/novo}"
          th:object="${cliente}" method="post" class="row g-3 mt-2" style="max-width:600px">

        <div class="col-12">
            <label class="form-label">Nome *</label>
            <input type="text" class="form-control" th:field="*{nome}"
                   th:classappend="${#fields.hasErrors('nome')} ? ' is-invalid'"/>
            <div class="invalid-feedback" th:errors="*{nome}"></div>
        </div>

        <div class="col-md-6">
            <label class="form-label">Telefone *</label>
            <input type="text" class="form-control" th:field="*{telefone}"
                   th:classappend="${#fields.hasErrors('telefone')} ? ' is-invalid'"/>
            <div class="invalid-feedback" th:errors="*{telefone}"></div>
        </div>

        <div class="col-md-6">
            <label class="form-label">CPF / CNPJ *</label>
            <input type="text" class="form-control" th:field="*{cpfCnpj}"
                   th:classappend="${#fields.hasErrors('cpfCnpj')} ? ' is-invalid'"/>
            <div class="invalid-feedback" th:errors="*{cpfCnpj}"></div>
        </div>

        <div class="col-12">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" th:field="*{email}"
                   th:classappend="${#fields.hasErrors('email')} ? ' is-invalid'"/>
            <div class="invalid-feedback" th:errors="*{email}"></div>
        </div>

        <div class="col-12">
            <label class="form-label">Endereço</label>
            <input type="text" class="form-control" th:field="*{endereco}"/>
        </div>

        <div class="col-12">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" th:field="*{ativo}" id="ativo"/>
                <label class="form-check-label" for="ativo">Ativo</label>
            </div>
        </div>

        <div class="col-12">
            <button type="submit" class="btn btn-success">
                <i class="bi bi-check-lg"></i> Salvar
            </button>
            <a th:href="@{/clientes}" class="btn btn-secondary ms-2">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
