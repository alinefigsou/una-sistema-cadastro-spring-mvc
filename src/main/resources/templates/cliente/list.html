<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Clientes</h2>
        <a th:href="@{/clientes/novo}" class="btn btn-primary">
            <i class="bi bi-plus-lg"></i> Novo Cliente
        </a>
    </div>
    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>Nome</th>
                    <th>Telefone</th>
                    <th>Email</th>
                    <th>CPF/CNPJ</th>
                    <th>Ativo</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="c : ${clientes}">
                    <td th:text="${c.id}"></td>
                    <td th:text="${c.nome}"></td>
                    <td th:text="${c.telefone}"></td>
                    <td th:text="${c.email}"></td>
                    <td th:text="${c.cpfCnpj}"></td>
                    <td>
                        <span th:class="${c.ativo} ? 'badge bg-success' : 'badge bg-secondary'"
                              th:text="${c.ativo} ? 'Sim' : 'Não'"></span>
                    </td>
                    <td>
                        <a th:href="@{/clientes/{id}/editar(id=${c.id})}"
                           class="btn btn-sm btn-warning">
                            <i class="bi bi-pencil"></i> Editar
                        </a>
                        <a th:href="@{/clientes/{id}/excluir(id=${c.id})}"
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('Confirmar exclusão?')">
                            <i class="bi bi-trash"></i> Excluir
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(clientes)}">
                    <td colspan="7" class="text-center text-muted py-3">Nenhum cliente cadastrado.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
