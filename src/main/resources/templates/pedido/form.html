<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">
    <h2>Novo Pedido</h2>

    <form th:action="@{/pedidos/novo}" th:object="${pedidoForm}" method="post" class="mt-3">

        <div class="mb-3" style="max-width:400px">
            <label class="form-label">Cliente *</label>
            <select class="form-select" th:field="*{clienteId}"
                    th:classappend="${#fields.hasErrors('clienteId')} ? ' is-invalid'">
                <option value="">Selecione um cliente...</option>
                <option th:each="c : ${clientes}"
                        th:value="${c.id}"
                        th:text="${c.nome}"></option>
            </select>
            <div class="invalid-feedback" th:errors="*{clienteId}"></div>
        </div>

        <h5>Itens do Pedido</h5>
        <div class="table-responsive" style="max-width:700px">
            <table class="table table-bordered" id="itensTable">
                <thead class="table-light">
                    <tr>
                        <th style="width:60%">Produto</th>
                        <th style="width:20%">Quantidade</th>
                        <th style="width:20%">Ação</th>
                    </tr>
                </thead>
                <tbody id="itensBody">
                    <tr th:each="item, stat : *{itens}" th:id="'item-row-' + ${stat.index}">
                        <td>
                            <select class="form-select"
                                    th:name="'itens[' + ${stat.index} + '].produtoId'">
                                <option value="">Selecione...</option>
                                <option th:each="p : ${produtos}"
                                        th:value="${p.id}"
                                        th:text="${p.nome + ' (Estoque: ' + p.estoque + ')'}"
                                        th:selected="${p.id == item.produtoId}"></option>
                            </select>
                        </td>
                        <td>
                            <input type="number" class="form-control" min="1"
                                   th:name="'itens[' + ${stat.index} + '].quantidade'"
                                   th:value="${item.quantidade > 0 ? item.quantidade : 1}"/>
                        </td>
                        <td>
                            <button type="button" class="btn btn-sm btn-danger"
                                    onclick="removeRow(this)">
                                <i class="bi bi-trash"></i> Remover
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <button type="button" class="btn btn-secondary mb-3" onclick="addItemRow()">
            <i class="bi bi-plus-lg"></i> Adicionar Item
        </button>

        <div>
            <button type="submit" class="btn btn-success">
                <i class="bi bi-check-lg"></i> Criar Pedido
            </button>
            <a th:href="@{/pedidos}" class="btn btn-secondary ms-2">Cancelar</a>
        </div>
    </form>

    <script th:inline="javascript">
    /*<![CDATA[*/
    const produtos = /*[[${produtos}]]*/ [];
    let rowCount = /*[[${pedidoForm.itens.size()}]]*/ 1;

    function buildSelectOptions() {
        let html = '<option value="">Selecione...</option>';
        produtos.forEach(p => {
            html += `<option value="${p.id}">${p.nome} (Estoque: ${p.estoque})</option>`;
        });
        return html;
    }

    function addItemRow() {
        const tbody = document.getElementById('itensBody');
        const tr = document.createElement('tr');
        tr.id = 'item-row-' + rowCount;
        tr.innerHTML = `
            <td>
                <select class="form-select" name="itens[${rowCount}].produtoId">
                    ${buildSelectOptions()}
                </select>
            </td>
            <td>
                <input type="number" class="form-control" min="1" value="1"
                       name="itens[${rowCount}].quantidade"/>
            </td>
            <td>
                <button type="button" class="btn btn-sm btn-danger" onclick="removeRow(this)">
                    <i class="bi bi-trash"></i> Remover
                </button>
            </td>`;
        tbody.appendChild(tr);
        rowCount++;
    }

    function removeRow(btn) {
        const rows = document.querySelectorAll('#itensBody tr');
        if (rows.length > 1) {
            btn.closest('tr').remove();
            reindexRows();
        }
    }

    function reindexRows() {
        const rows = document.querySelectorAll('#itensBody tr');
        rows.forEach((row, idx) => {
            row.querySelectorAll('[name]').forEach(el => {
                el.name = el.name.replace(/itens\[\d+\]/, `itens[${idx}]`);
            });
        });
        rowCount = rows.length;
    }
    /*]]>*/
    </script>
</div>
</body>
</html>
