<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Pedidos</h2>
        <a th:href="@{/pedidos/novo}" class="btn btn-primary">
            <i class="bi bi-plus-lg"></i> Novo Pedido
        </a>
    </div>
    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>Cliente</th>
                    <th>Total (R$)</th>
                    <th>Data</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${pedidos}">
                    <td th:text="${p.id}"></td>
                    <td th:text="${p.cliente.nome}"></td>
                    <td th:text="${#numbers.formatDecimal(p.total, 1, 'POINT', 2, 'COMMA')}"></td>
                    <td th:text="${#temporals.format(p.dataPedido, 'dd/MM/yyyy HH:mm')}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${p.status.name() == 'PENDENTE'} ? 'bg-warning text-dark' :
                                             (${p.status.name() == 'CONFIRMADO'} ? 'bg-success' :
                                             (${p.status.name() == 'CANCELADO'} ? 'bg-danger' : 'bg-info text-dark'))"
                              th:text="${p.status}"></span>
                    </td>
                    <td>
                        <a th:href="@{/pedidos/{id}(id=${p.id})}"
                           class="btn btn-sm btn-info">
                            <i class="bi bi-eye"></i> Detalhe
                        </a>
                        <a th:href="@{/pedidos/{id}/excluir(id=${p.id})}"
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('Excluir pedido?')">
                            <i class="bi bi-trash"></i> Excluir
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(pedidos)}">
                    <td colspan="6" class="text-center text-muted py-3">Nenhum pedido cadastrado.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
