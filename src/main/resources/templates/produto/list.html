<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Produtos</h2>
        <a th:href="@{/produtos/novo}" class="btn btn-primary">
            <i class="bi bi-plus-lg"></i> Novo Produto
        </a>
    </div>
    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>Nome</th>
                    <th>Categoria</th>
                    <th>Preço (R$)</th>
                    <th>Estoque</th>
                    <th>Ativo</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${produtos}">
                    <td th:text="${p.id}"></td>
                    <td th:text="${p.nome}"></td>
                    <td th:text="${p.categoria}"></td>
                    <td th:text="${#numbers.formatDecimal(p.preco, 1, 'POINT', 2, 'COMMA')}"></td>
                    <td>
                        <span th:class="${p.estoque > 0} ? 'badge bg-success' : 'badge bg-danger'"
                              th:text="${p.estoque}"></span>
                    </td>
                    <td>
                        <span th:class="${p.ativo} ? 'badge bg-success' : 'badge bg-secondary'"
                              th:text="${p.ativo} ? 'Sim' : 'Não'"></span>
                    </td>
                    <td>
                        <a th:href="@{/produtos/{id}/editar(id=${p.id})}"
                           class="btn btn-sm btn-warning">
                            <i class="bi bi-pencil"></i> Editar
                        </a>
                        <a th:href="@{/produtos/{id}/excluir(id=${p.id})}"
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('Confirmar exclusão?')">
                            <i class="bi bi-trash"></i> Excluir
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(produtos)}">
                    <td colspan="7" class="text-center text-muted py-3">Nenhum produto cadastrado.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
