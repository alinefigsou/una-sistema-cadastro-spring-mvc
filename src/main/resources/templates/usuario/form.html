<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">
    <h2 th:text="${editMode} ? 'Editar Usuário' : 'Novo Usuário'">Usuário</h2>

    <form th:action="${editMode} ? @{/usuarios/{id}/editar(id=${usuario.id})} : @{/usuarios/novo}"
          th:object="${usuario}" method="post" class="row g-3 mt-2" style="max-width:600px">

        <div class="col-12">
            <label class="form-label">Nome *</label>
            <input type="text" class="form-control" th:field="*{nome}"
                   th:classappend="${#fields.hasErrors('nome')} ? ' is-invalid'"/>
            <div class="invalid-feedback" th:errors="*{nome}"></div>
        </div>

        <div class="col-12">
            <label class="form-label">Email *</label>
            <input type="email" class="form-control" th:field="*{email}"
                   th:classappend="${#fields.hasErrors('email')} ? ' is-invalid'"/>
            <div class="invalid-feedback" th:errors="*{email}"></div>
        </div>

        <div class="col-12">
            <label class="form-label">
                Senha <small class="text-muted" th:if="${editMode}">(deixe em branco para manter a atual)</small>
                <span th:unless="${editMode}"> *</span>
            </label>
            <input type="password" class="form-control" name="rawSenha"
                   th:classappend="${#fields.hasErrors('senha')} ? ' is-invalid'"/>
            <div class="invalid-feedback" th:errors="*{senha}"></div>
        </div>

        <div class="col-md-6">
            <label class="form-label">Role *</label>
            <select class="form-select" th:field="*{role}"
                    th:classappend="${#fields.hasErrors('role')} ? ' is-invalid'">
                <option value="">Selecione...</option>
                <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
            </select>
            <div class="invalid-feedback" th:errors="*{role}"></div>
        </div>

        <div class="col-md-6 d-flex align-items-end">
            <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox" th:field="*{ativo}" id="ativo"/>
                <label class="form-check-label" for="ativo">Ativo</label>
            </div>
        </div>

        <div class="col-12">
            <button type="submit" class="btn btn-success">
                <i class="bi bi-check-lg"></i> Salvar
            </button>
            <a th:href="@{/usuarios}" class="btn btn-secondary ms-2">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
