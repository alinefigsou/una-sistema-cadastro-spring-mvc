<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Usuários</h2>
        <a th:href="@{/usuarios/novo}" class="btn btn-primary">
            <i class="bi bi-plus-lg"></i> Novo Usuário
        </a>
    </div>
    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>Nome</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Ativo</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="u : ${usuarios}">
                    <td th:text="${u.id}"></td>
                    <td th:text="${u.nome}"></td>
                    <td th:text="${u.email}"></td>
                    <td th:text="${u.role}"></td>
                    <td>
                        <span th:class="${u.ativo} ? 'badge bg-success' : 'badge bg-secondary'"
                              th:text="${u.ativo} ? 'Sim' : 'Não'"></span>
                    </td>
                    <td>
                        <a th:href="@{/usuarios/{id}/editar(id=${u.id})}"
                           class="btn btn-sm btn-warning">
                            <i class="bi bi-pencil"></i> Editar
                        </a>
                        <a th:href="@{/usuarios/{id}/excluir(id=${u.id})}"
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('Confirmar exclusão?')">
                            <i class="bi bi-trash"></i> Excluir
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(usuarios)}">
                    <td colspan="6" class="text-center text-muted py-3">Nenhum usuário cadastrado.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
